// Messages between the WinUI shell and the Rust core (crates/offline-maps-ffi).
//
// Evolution rules: never reuse a field number; reserve removed fields and names.
// Unknown fields are ignored. An unknown enum value is treated as UNSPECIFIED and
// rejected as an invalid argument. Every request carries a request ID that the
// response echoes. This schema is versioned separately from the ABI (ABI_VERSION)
// and from the on-disk formats of the package store.
syntax = "proto3";

package offline_maps;

option csharp_namespace = "OfflineMaps.Interop.Messages";

// Passed to om_create.
message Config {
  // Folder holding map packages, extras and saved places (created if missing).
  string store_directory = 1;
  // Overrides of Illinois's (us-il) download addresses, for testing against a
  // local server; empty uses the defaults. Other regions always use Geofabrik.
  string package_url = 2;
  string extras_url = 3;
  // Override of the terrain archive's address, for testing; empty uses Mapterhorn.
  string terrain_url = 4;
  // Override of where overlay files are published (files are
  // <base>/<region>-overlays.mbtiles), for testing; empty uses the GitHub releases.
  string overlays_url = 5;
  // The built-in overview of the whole country (an MBTiles file in the program
  // folder); empty for none.
  string overview_path = 6;
}

message Position {
  double latitude = 1;
  double longitude = 2;
}

message Request {
  uint64 request_id = 1;
  oneof command {
    GetStatus get_status = 2;
    Search search = 3;
    AddPlace add_place = 4;
    UpdatePlace update_place = 5;
    RemovePlace remove_place = 6;
    Update update = 7;
    GetStations get_stations = 8;
    PrepareSearch prepare_search = 9;
    ResetPlaces reset_places = 10;
    RemoveRegion remove_region = 11;
    GetCatalog get_catalog = 12;
    GetTerrainTile get_terrain_tile = 13;
    GetOverlayTile get_overlay_tile = 14;
    GetOverviewTile get_overview_tile = 15;
    MoveStore move_store = 16;
    RemoveMovedSource remove_moved_source = 17;
  }
}

message GetStatus {}

message Search {
  string query = 1;
  // The map position; results are ordered by distance from it when present.
  Position near = 2;
  // 1 to 100; 0 means 20.
  uint32 limit = 3;
}

message AddPlace {
  string name = 1;
  string note = 2;
  Position position = 3;
}

message UpdatePlace {
  uint64 id = 1;
  string name = 2;
  string note = 3;
}

message RemovePlace {
  uint64 id = 1;
}

enum UpdateTarget {
  UPDATE_TARGET_UNSPECIFIED = 0;
  // The map package (tiles and search).
  UPDATE_TARGET_MAP = 1;
  // Fuel and charging stations and addresses from the raw extract.
  UPDATE_TARGET_EXTRAS = 2;
  // Terrain tiles for the region's map area (needs the map installed).
  UPDATE_TARGET_TERRAIN = 3;
  // Flood zones and public lands, prebuilt and published with the app's releases.
  UPDATE_TARGET_OVERLAYS = 4;
}

// Downloads or updates one region's map or extras. Long-running: progress is
// read with om_progress, cancelled with om_cancel. One update runs at a time.
message Update {
  UpdateTarget target = 1;
  // A catalog region ID such as "us-il".
  string region_id = 2;
  // Only ask the server whether it has something newer; download nothing.
  bool check_only = 3;
}

// Deletes a region's map, search index and extras from the store.
message RemoveRegion {
  string region_id = 1;
}

// The regions that can be downloaded.
message GetCatalog {}

// An overlay tile (XYZ numbering): a decompressed vector tile with layers
// flood_zones, public_lands and public_land_labels, merged across regions.
message GetOverlayTile {
  uint32 z = 1;
  uint32 x = 2;
  uint32 y = 3;
}

// An overview tile (XYZ numbering): a decompressed vector tile of the built-in
// whole-country overview, layers water, rivers, boundaries, roads, places and labels.
message GetOverviewTile {
  uint32 z = 1;
  uint32 x = 2;
  uint32 y = 3;
}

// A terrain tile (XYZ numbering): Terrarium-encoded elevation as a 512-pixel WebP.
message GetTerrainTile {
  uint32 z = 1;
  uint32 x = 2;
  uint32 y = 3;
}

message GetStations {}

// Builds the search index of every installed map that has none. Long-running.
message PrepareSearch {}

// Moves an unreadable saved-places file aside so a new list can be started.
message ResetPlaces {}

// Moves the installed maps and saved places to another folder (created if
// missing). Only the store's own entries move; other files in either folder
// are left alone. Runs like an update: one at a time, progress through
// om_progress (phase "Moving"), stopped by om_cancel. While it runs, and after
// it succeeds, this core shows no maps and refuses changes. On success the
// caller records the new folder, sends RemoveMovedSource when the result says
// the maps were copied, then closes this core and opens one on the new folder.
// On failure the maps stay where they were and this core serves them again.
message MoveStore {
  string destination = 1;
}

// After a MoveStore that copied: removes the originals from the old folder.
message RemoveMovedSource {}

enum ErrorKind {
  ERROR_KIND_UNSPECIFIED = 0;
  ERROR_KIND_INVALID_ARGUMENT = 1;
  ERROR_KIND_NOT_FOUND = 2;
  ERROR_KIND_BUSY = 3;
  ERROR_KIND_CANCELLED = 4;
  ERROR_KIND_NETWORK = 5;
  ERROR_KIND_STORAGE = 6;
  ERROR_KIND_INVALID_DATA = 7;
  ERROR_KIND_UNAVAILABLE = 8;
  ERROR_KIND_INTERNAL = 9;
}

// An expected failure. The message is written for the person using the app.
message Error {
  ErrorKind kind = 1;
  string message = 2;
}

message Response {
  uint64 request_id = 1;
  // Set when the request failed; no result is set then.
  Error error = 2;
  oneof result {
    Status status = 3;
    SearchResults search = 4;
    Place place = 5;
    UpdateResult update = 6;
    Stations stations = 7;
    Catalog catalog = 8;
    TerrainTile terrain_tile = 9;
    OverlayTile overlay_tile = 10;
    OverviewTile overview_tile = 11;
    MoveStoreResult move_store = 12;
  }
}

message OverlayTile {
  // Empty when no installed overlays have the tile.
  bytes data = 1;
}

message OverviewTile {
  // Empty where the overview has no tile.
  bytes data = 1;
}

message TerrainTile {
  // Empty when no installed terrain has the tile.
  bytes data = 1;
}

message Bounds {
  double west = 1;
  double south = 2;
  double east = 3;
  double north = 4;
}

message MapInfo {
  string version = 1;
  string region_name = 2;
  // Server date of the package (YYYY-MM-DD), the closest proxy for the data date.
  string data_date = 3;
  // RFC 3339.
  string downloaded_at = 4;
  uint64 bytes = 5;
  Bounds bounds = 6;
  uint32 min_zoom = 7;
  uint32 max_zoom = 8;
  string attribution = 9;
  string source_url = 10;
  uint64 tiles = 11;
}

message ExtrasInfo {
  string version = 1;
  // OSM data time of the raw extract (YYYY-MM-DD).
  string data_date = 2;
  string downloaded_at = 3;
  uint64 fuel = 4;
  uint64 charging = 5;
  uint64 addresses = 6;
  // Size of the raw extract that was read (it is not kept).
  uint64 source_bytes = 7;
  uint64 shelters = 8;
  uint64 drinking_water = 9;
  uint64 campgrounds = 10;
  uint64 toilets = 11;
  // Built with outdoor places (shelters, water, campgrounds, toilets); false
  // for extras installed before 0.4.0, which an update rebuilds.
  bool outdoor = 12;
}

message CatalogRegion {
  string id = 1;
  string name = 2;
  // Approximate download sizes when the catalog was made.
  uint64 package_bytes = 3;
  uint64 extras_bytes = 4;
  string source_page = 5;
  uint64 terrain_bytes = 6;
  // 0 when no flood zones and public lands file is published for the region.
  uint64 overlay_bytes = 7;
  // Where the map and the raw extract are downloaded from (Geofabrik, or this
  // project's releases for regions it builds).
  string package_url = 8;
  string extras_url = 9;
}

message Catalog {
  // By name.
  repeated CatalogRegion regions = 1;
}

// An installed region: one with a map, extras, or files that could not be read.
message RegionStatus {
  string id = 1;
  string name = 2;
  // Absent when the region's map is not installed or cannot be opened.
  MapInfo map = 3;
  // Absent when its stations and addresses are not installed.
  ExtrasInfo extras = 4;
  // The map has a usable search index.
  bool search_ready = 5;
  // Set when the region's map, extras or terrain could not be opened.
  string problem = 6;
  // Absent when its terrain is not installed.
  TerrainInfo terrain = 7;
  // Absent when its flood zones and public lands are not installed.
  OverlayInfo overlays = 8;
}

message OverlayInfo {
  string version = 1;
  string downloaded_at = 2;
  uint64 bytes = 3;
  // FEMA's flood product (e.g. NFHL_17_20261027) and its effective date.
  string flood_product = 4;
  string flood_effective = 5;
  // e.g. "USGS PAD-US 4.1".
  string public_lands = 6;
  // When the file was built (RFC 3339).
  string built_at = 7;
}

message TerrainInfo {
  string version = 1;
  // Server date of the terrain archive (YYYY-MM-DD).
  string data_date = 2;
  string downloaded_at = 3;
  uint64 bytes = 4;
  uint64 tiles = 5;
  uint32 max_zoom = 6;
  string attribution = 7;
}

message Place {
  uint64 id = 1;
  string name = 2;
  string note = 3;
  double latitude = 4;
  double longitude = 5;
  // Inside an installed map's bounds.
  bool covered = 6;
  string created_at = 7;
  string updated_at = 8;
}

message Status {
  // Replaced by regions in 0.2.0 (several regions can be installed).
  reserved 1, 2, 8;
  reserved "map", "extras", "region_name";
  repeated Place places = 3;
  // Every installed map has a usable search index.
  bool search_ready = 4;
  // The problems of all installed regions, joined.
  string map_problem = 5;
  // Set when the saved-places file cannot be read (it is left untouched).
  string places_problem = 6;
  string store_directory = 7;
  bool updating = 9;
  // Installed regions, by name.
  repeated RegionStatus regions = 10;
  // The box around all installed maps; absent when none is installed.
  Bounds coverage = 11;
  uint32 min_zoom = 12;
  uint32 max_zoom = 13;
  // Changes whenever an installed map, extras or terrain changes.
  string content_version = 14;
  // The box around all installed terrain; absent when none is installed.
  Bounds terrain_coverage = 15;
  // The box around all installed overlays; absent when none are installed.
  Bounds overlay_coverage = 16;
}

message SearchResult {
  string name = 1;
  // place, street, poi, transit, water or address.
  string kind = 2;
  string category = 3;
  string near = 4;
  double latitude = 5;
  double longitude = 6;
  string reference = 7;
  bool has_distance = 8;
  double distance_km = 9;
  string detail = 10;
}

message SearchResults {
  repeated SearchResult results = 1;
}

message UpdateResult {
  bool up_to_date = 1;
  string version = 2;
  string replaced = 3;
  // Check only: the server has something newer, not downloaded.
  bool available = 4;
  // Its date (YYYY-MM-DD) and size in bytes, where the server reports them.
  string remote_date = 5;
  uint64 remote_bytes = 6;
}

message Stations {
  // GeoJSON FeatureCollection with name, category and detail properties.
  string geojson = 1;
}

message MoveStoreResult {
  // The maps were copied to another drive and the originals are still in the
  // old folder until RemoveMovedSource.
  bool copied = 1;
  // Bytes moved; 0 when there was nothing to move.
  uint64 bytes = 2;
}

// Returned by om_progress.
message ProgressEvent {
  bool active = 1;
  UpdateTarget target = 2;
  // Checking, Downloading, Verifying, Preparing, Activating, Removing, Moving.
  string phase = 3;
  uint64 done = 4;
  // 0 when unknown.
  uint64 total = 5;
  bool cancelling = 6;
  string region_id = 7;
  string region_name = 8;
}
